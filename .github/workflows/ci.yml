name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # weekly: catches a dependency or data-source change

jobs:
  test:
    # Synthetic-signal tests on every supported Python. Tests that need the
    # CWRU recordings skip here because data/raw is not committed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests notebooks
      - run: ruff format --check src tests notebooks
      - run: pytest -rs

  regression:
    # The full pipeline on the real recordings, with the pinned versions that
    # produced reports/. Fails if any committed result or figure changes, so a
    # code change can never move a number silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v5
        with:
          path: data/raw
          key: cwru-${{ hashFiles('data/manifest.csv') }}
      - run: pip install -r requirements-lock.txt && pip install -e ".[dev]"
      - name: Type check (pinned versions, so the verdict is deterministic)
        run: python -m mypy
      - run: bearing-audit fetch
      - run: bearing-audit all
      - name: Results must match the committed ones (labels exactly, numbers to 1e-9)
        run: python scripts/compare_results.py
      - name: Figures must be pixel-identical to the committed ones
        run: python scripts/compare_figures.py
      - name: Full test suite with real data, coverage floor
        run: pytest -rs --cov=bearing_audit --cov-report=term --cov-fail-under=85
      - name: Both notebooks run end to end; the full pipeline must reproduce every committed result
        env:
          BEARING_AUDIT_STRICT: "1"
        run: |
          pip install -e ".[notebook]"
          jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP" notebooks/bearing_audit_presentation.ipynb
          jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP" \
            --ExecutePreprocessor.timeout=1800 notebooks/bearing_audit_full_pipeline.ipynb

  docker:
    # Build the image and run a quick smoke test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t bearing-audit .
      - run: docker run --rm bearing-audit --help
