[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bearing-audit"
version = "1.0.0"
description = "Bearing fault diagnosis on the CWRU dataset: envelope analysis, physics verification and a per-bearing leakage audit."
readme = "README.md"
license = "MIT"
authors = [{ name = "Parv Parakhiya" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
]
keywords = ["predictive-maintenance", "condition-monitoring", "vibration", "envelope-analysis", "bearing-fault", "cwru"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=5", "ruff==0.15.11", "mypy==2.3.1", "pre-commit>=3.5"]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbconvert>=7"]

[project.scripts]
bearing-audit = "bearing_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bearing_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["data: needs the CWRU files in data/raw (skipped when absent)"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src/bearing_audit"]
ignore_missing_imports = true   # scipy / sklearn / matplotlib ship partial or no stubs
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
